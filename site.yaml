  zonas:
    activa: true
    antetitulo: Dónde trabajamos
    titulo: Alcalá y el Corredor del Henares
    texto: "Vamos a todos los barrios de Alcalá y a los pueblos de alrededor. Si el tuyo no está, pregúntanos."
    imagen: /fotos/zonas.jpg
    titulo_pagina: "Limpieza del hogar en {zona}"
    texto_pagina: "{negocio} limpia y cuida casas en {zona}, con la misma persona de confianza y sin permanencia."
    items:
      - titulo: Alcalá de Henares
        texto: "Alcalá es nuestra casa: aquí está la oficina y desde aquí salen todos los equipos. Trabajamos en el casco histórico, en los barrios más nuevos y en las urbanizaciones de las afueras, tanto en pisos como en chalés y adosados. Los planes semanales y quincenales son los más pedidos, pero también hacemos limpiezas a fondo antes de una mudanza, cristales de ventanales y puesta a punto de terrazas y patios. Al conocer bien la ciudad, organizamos las rutas para llegar siempre puntuales y podemos empezar muy pronto, normalmente a los pocos días de pedir presupuesto."
      - titulo: Torrejón de Ardoz
        texto: "En Torrejón de Ardoz atendemos a familias, parejas jóvenes y personas mayores que viven en pisos y en viviendas de las urbanizaciones. Es una de las zonas donde más limpiezas de fin de obra y de mudanza hacemos, porque hay muchas casas que se reforman o cambian de manos. También ofrecemos mantenimiento semanal, cristales y plancha con recogida. Desde Torrejón llegamos sin problema a Meco y a Alcalá, así que si tienes familia en alguno de esos pueblos podemos organizar el servicio de las dos casas con la misma persona de confianza y una única factura mensual."
      - titulo: Meco
        texto: "Meco es un pueblo tranquilo donde muchas casas tienen jardín, terraza o piscina, y por eso allí hacemos algo más que limpieza interior. Además del mantenimiento semanal, nos piden siega, poda de setos, limpieza de patios y puesta a punto de la piscina en primavera. Los equipos que trabajan en Meco suelen compartir ruta con Villalbilla y Camarma de Esteruelas, de modo que podemos ofrecer horarios fijos y continuidad. Si vives en una vivienda de fin de semana o en una casa que usas solo en verano, te la preparamos antes de que llegues y la dejamos cerrada cuando te vayas."
      - titulo: Villalbilla
        texto: "En Villalbilla trabajamos con muchas familias que viven en casas unifamiliares y adosados. Lo más habitual es un plan semanal o quincenal, con la misma persona de confianza, que conoce la casa y la deja siempre a punto. También hacemos limpiezas a fondo antes de las fiestas o de la llegada de familiares, cristales de grandes ventanales y limpieza de terrazas y porches. Villalbilla queda muy cerca de Alcalá y de Los Santos de la Humosa, así que podemos organizar las visitas con flexibilidad y reaccionar rápido cuando necesitas un repaso o una sustitución en el último momento."
      - { titulo: Los Santos de la Humosa }
      - titulo: Camarma de Esteruelas
        texto: "Camarma de Esteruelas es una de las zonas en las que más ha crecido nuestra clientela en los últimos tiempos. Atendemos viviendas nuevas, adosados y pisos de reciente construcción, donde solemos empezar con una limpieza de fin de obra o una limpieza a fondo antes de la mudanza, y después seguimos con el mantenimiento semanal. También cuidamos terrazas, jardines pequeños y zonas comunes de las casas. Como el pueblo está junto a Meco, Anchuelo y Alcalá, nuestros equipos se reparten bien por la comarca y podemos darte día y hora fijos, sin retrasos ni cambios de persona."
      - { titulo: Anchuelo }
      - { titulo: Torres de la Alameda }

  garantias:
    activa: true
    antetitulo: Garantías
    titulo: Tranquilidad por escrito
    items:
      - { titulo: "Si no quedas contento, volvemos", texto: "Repasamos gratis lo que no esté a tu gusto en las 24 horas siguientes.", icono: check }
      - { titulo: Personal contratado y asegurado, texto: "Todas las personas del equipo tienen contrato y seguro de responsabilidad civil.", icono: escudo }
      - { titulo: Sustituciones sin esperas, texto: "Si tu persona de confianza está de vacaciones o de baja, te mandamos a otra del equipo.", icono: usuarios }
      - { titulo: Llaves bajo custodia, texto: "Guardamos tus llaves codificadas, sin nombre ni dirección.", icono: llave }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen en casa
    testimonios:
      - { texto: "Llevan tres años viniendo cada martes y siempre la misma persona. Llego del trabajo y la casa está como nueva.", autor: Marta L., servicio: "Plan semanal · El Val" }
      - { texto: "Hicieron la limpieza de fin de obra del piso en un día. Ni rastro de polvo y los cristales, perfectos.", autor: Jorge y Elena, servicio: "Fin de obra · Espartales" }
      - { texto: "Acompañan a mi madre dos tardes por semana. Es un alivio saber que está con alguien de confianza.", autor: Ana R., servicio: "Acompañamiento · Casco histórico" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de empezar
    texto: "Si tienes otra duda, escríbenos por WhatsApp y te contestamos enseguida."
    preguntas:
      - { pregunta: "¿Tengo que poner yo los productos?", respuesta: "No. Llevamos productos y material profesional. Si prefieres que usemos los tuyos, también lo hacemos." }
      - { pregunta: "¿Viene siempre la misma persona?", respuesta: "Sí. Te asignamos una persona fija y solo cambia si está de vacaciones o de baja; entonces te avisamos y mandamos a otra de confianza." }
      - { pregunta: "¿Hay permanencia o penalización?", respuesta: "No. Puedes cambiar de plan, pausarlo en verano o darte de baja avisando con una semana de antelación." }
      - { pregunta: "¿Tengo que estar en casa?", respuesta: "No hace falta. Muchos clientes nos dejan una llave, que guardamos codificada y sin datos de la vivienda." }
      - { pregunta: "¿Cómo se paga?", respuesta: "Por domiciliación a final de mes o por transferencia. Te mandamos la factura por correo." }

