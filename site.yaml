  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Todo lo que tu casa necesita
    texto: "Elige un servicio suelto o combínalos en un plan. Llevamos nosotros los productos y el material."
    items:
      - titulo: Limpieza de mantenimiento
        texto: "Polvo, suelos, baños y cocina cada semana o cada quince días."
        icono: escoba
        precio: "desde 16 €/hora"
        imagenes: "/fotos/cocina.jpg; /fotos/bano.jpg"
        detalle: |
          La limpieza de mantenimiento es el servicio de siempre: una persona de confianza que viene los días que acordáis y deja la casa como si no hubiera pasado la semana. Se pasa el polvo, se friegan los suelos, se limpian a conciencia los baños y la cocina, se hacen las camas y se vacían las papeleras.

          Antes de empezar visitamos la casa o hablamos contigo para saber qué es importante en la tuya: la habitación que más se usa, las superficies delicadas, los productos que prefieres. Todo queda apuntado en una hoja que la persona del equipo tiene siempre a mano.

          Va bien para familias con poco tiempo, personas que trabajan fuera o mayores que ya no pueden con las tareas pesadas. Llevamos nosotros productos y material, no hay permanencia y, si un día no te encaja, lo cambiamos sin penalización. Siempre viene la misma persona, y si falta, te avisamos de quién la sustituye.
      - titulo: Limpieza a fondo
        texto: "Armarios por dentro, azulejos, juntas, electrodomésticos y rincones."
        icono: chispa
        precio: "desde 120 €"
        imagenes: "/fotos/bano.jpg; /fotos/cocina.jpg"
        detalle: |
          La limpieza a fondo es la que llega a los sitios que el día a día no alcanza. Trabajan dos personas, que limpian por dentro armarios y cajones, frotan azulejos y juntas, desengrasan campana, horno y encimera y dejan los electrodomésticos como recién estrenados.

          Es el servicio ideal para empezar de cero antes de contratar un plan de mantenimiento, para preparar la casa antes de una visita importante o para la puesta a punto de cada cambio de estación. También la piden quienes se instalan en una vivienda que estuvo cerrada o alquilada.

          Antes de empezar te preguntamos por las zonas que más te preocupan y por cualquier superficie que requiera cuidado especial, como mármol, madera o acero. Usamos productos adecuados para cada material y no dejamos olores fuertes. Al terminar repasamos contigo el resultado, y si algo no está a tu gusto, volvemos a repasarlo gratis.
      - titulo: Cristales y persianas
        texto: "Ventanas por dentro y por fuera, guías, marcos y lamas de persiana."
        icono: sol
        precio: "desde 45 €"
        imagenes: "/fotos/cristales.jpg"
        detalle: |
          Unos cristales limpios cambian la luz de toda la casa. Limpiamos ventanas y puertas de balcón por dentro y por fuera, con atención a los marcos, las guías de las correderas, los alféizares y las lamas de las persianas, que acumulan más polvo del que parece.

          Trabajamos con material profesional que no deja marcas ni velos y con el equipo de seguridad necesario para los ventanales altos o de difícil acceso. Si tu casa tiene terraza cerrada, galería o mamparas de baño, también las incluimos.

          Es un servicio que muchos clientes piden en primavera y tras el verano, o después de una obra, cuando el polvo se queda pegado al cristal. Puedes contratarlo suelto o añadirlo a tu plan de mantenimiento con la frecuencia que prefieras. No hace falta que estés en casa: nos organizamos contigo para entrar y salir cuando te venga mejor.
      - titulo: Fin de obra y mudanza
        texto: "Quitamos el polvo de obra y los restos de pintura y dejamos el piso listo para entrar."
        icono: herramienta
        precio: "Consultar"
        imagenes: "/fotos/bano.jpg"
        detalle: |
          Después de una reforma, la casa queda cubierta de un polvo fino que se cuela en todas partes. Nuestro servicio de fin de obra elimina ese polvo, quita los restos de pintura, silicona y cemento de suelos, cristales, sanitarios y azulejos y deja el piso listo para colocar los muebles.

          También lo contratan quienes están a punto de mudarse y quieren entregar la vivienda impecable, o quienes llegan a una casa nueva y prefieren estrenarla limpia. Trabajamos con aspiración profesional y con productos que no dañan los acabados recientes.

          Como cada obra es distinta, preparamos el presupuesto después de ver el piso o de revisar fotos y medidas contigo. Te decimos cuánta gente irá, cuánto tiempo necesitamos y qué incluye exactamente el servicio, por escrito y con precio cerrado. Si hace falta, coordinamos la fecha con el último gremio para empezar justo cuando termine.
      - { titulo: Plancha y ropa, texto: "Lavado, planchado y ropa doblada en su sitio. En casa o con recogida.", icono: hoja, precio: "desde 14 €/hora" }
      - titulo: Acompañamiento a mayores
        texto: "Compañía, paseos, recados y ayuda en casa para que vivan tranquilos."
        icono: corazon
        precio: "Consultar"
        detalle: |
          Acompañar a una persona mayor es mucho más que estar presente: es darle compañía, seguridad y pequeñas ayudas para que siga viviendo en su casa con tranquilidad. Nuestro equipo charla, pasea con ella, la acompaña al médico o a la compra, prepara una merienda y echa una mano con los recados.

          Antes de empezar conocemos a la persona y a su familia para entender sus costumbres, sus horarios y lo que necesita. Después presentamos a la persona del equipo que mejor encaja y se queda como referencia fija, para que se forme una relación de confianza.

          El servicio se organiza por tardes, mañanas o los días que mejor vengan a la familia, y se puede combinar con la limpieza del hogar. La familia recibe un aviso si ocurre cualquier cosa fuera de lo normal. Todo el personal tiene contrato y seguro, y guardamos las llaves codificadas y bajo custodia.
      - { titulo: Jardín y terrazas, texto: "Siega, poda de setos, riego y limpieza de terrazas y patios.", icono: montana, precio: "Consultar" }
      - { titulo: Piscinas, texto: "Puesta a punto en primavera, mantenimiento semanal y cierre en otoño.", icono: gota, precio: "desde 60 €/mes" }
    galeria:    # franja de fotos a sangre bajo los servicios
