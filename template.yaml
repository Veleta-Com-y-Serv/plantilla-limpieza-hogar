# Metadatos de la plantilla para el catálogo de NoExpertise.
id: limpieza-hogar
nombre: Limpieza y servicios del hogar
descripcion: Web fresca para empresas de limpieza y servicios del hogar, con planes, zonas y presupuesto por metros.
sectores:
  - { id: limpieza, nombre: Limpieza }
  - { id: servicios-domesticos, nombre: Servicios domésticos }
  - { id: cuidado-mayores, nombre: Cuidado de mayores }
  - { id: jardineria, nombre: Jardinería }
  - { id: piscinas, nombre: Piscinas }
secciones:
  - { id: hero, nombre: Portada }
  - { id: servicios, nombre: Servicios }
  - { id: cifras, nombre: Cifras }
  - { id: planes, nombre: Planes y precios }
  - { id: proceso, nombre: Cómo funciona }
  - { id: zonas, nombre: Zonas }
  - { id: garantias, nombre: Garantías }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: presupuesto, nombre: Presupuesto }
  - { id: contacto, nombre: Contacto }
estilo: fresco
plan_minimo: gratis
version: 1.0.0
base: astrowind
demo_url: https://demo-plantilla-limpieza-hogar.noexpertise.com
activa: true
orden: 390

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu negocio"
    pregunta: "¿Cómo se llama tu empresa, qué servicios del hogar haces y en qué localidad?"
    ayuda: "Qué limpiáis o cuidáis, para quién y por qué os eligen a vosotros."
    tipo: texto
    campos: [nombre, eslogan, seo.titulo, seo.descripcion, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.titulo_destacado, secciones.hero.texto]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: servicios
    titulo: "Servicios"
    pregunta: "¿Qué servicios ofreces? Uno por línea, con una frase de qué incluye y, si quieres, el precio."
    ayuda: "Limpieza de casas, cristales, fin de obra, plancha, jardín, piscinas, acompañamiento…"
    tipo: texto
    campos: [secciones.servicios.titulo, secciones.servicios.texto, secciones.servicios.items]
  - id: planes
    titulo: "Planes y precios"
    pregunta: "¿Tienes planes por semanas o por meses? Nombre, precio, cada cuánto y qué incluye. Uno por línea."
    ayuda: "Si no quieres poner precios, escribe «Consultar». Puedes añadirlos luego en Contenido."
    tipo: lista
    campos: [secciones.planes.planes]
  - id: proceso
    titulo: "Cómo funciona"
    pregunta: "¿Qué pasos sigue un cliente desde que te llama hasta que tiene la casa limpia?"
    tipo: texto
    campos: [secciones.proceso.titulo, secciones.proceso.texto, secciones.proceso.items]
  - id: zonas
    titulo: "Zonas"
    pregunta: "¿En qué pueblos o barrios trabajáis? Uno por línea."
    tipo: texto
    campos: [secciones.zonas.titulo, secciones.zonas.texto, secciones.zonas.items]
  - id: garantias
    titulo: "Garantías"
    pregunta: "¿Qué tranquilidad das a tus clientes? Repasos gratis, seguro, sustituciones, custodia de llaves… Una por línea."
    tipo: texto
    campos: [secciones.garantias.titulo, secciones.garantias.items]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan antes de contratar? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, fotos de casas que habéis dejado relucientes."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.servicios.galeria, secciones.proceso.imagen, secciones.zonas.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
